<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotball-IQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Endless football decision puzzles in Norwegian and English. Fotball-IQ: uendelig mange taktiske oppgaver.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one column "coach's clipboard" — scoreboard strip, question, tactics board, feedback card. */
:root {
  --bg: #e9efe8;
  --surface: #ffffff;
  --surface-2: #f3f7f2;
  --fg: #12221a;
  --muted: #56685d;
  --line: #cfdad1;
  --accent: #0f7a4a;
  --accent-fg: #ffffff;
  --you: #f2b705;
  --good: #138a4b;
  --bad: #c8372d;
  --warn: #d97a06;
  --pitch-a: #2f8f55;
  --pitch-b: #2a854e;
  --chalk: rgba(255,255,255,.85);
  --team: #1f5fd1;
  --opp: #d23a32;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1611; --surface: #15211a; --surface-2: #1b2a21; --fg: #e5efe8; --muted: #9db2a4;
    --line: #2a3d31; --accent: #38c27e; --accent-fg: #06150d; --you: #ffcc33; --good: #3ccf84;
    --bad: #ff6b5e; --warn: #ffa63d; --pitch-a: #1f6b3e; --pitch-b: #1c6339; --chalk: rgba(255,255,255,.75);
    --team: #3d7cf0; --opp: #e5483f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1611; --surface: #15211a; --surface-2: #1b2a21; --fg: #e5efe8; --muted: #9db2a4;
  --line: #2a3d31; --accent: #38c27e; --accent-fg: #06150d; --you: #ffcc33; --good: #3ccf84;
  --bad: #ff6b5e; --warn: #ffa63d; --pitch-a: #1f6b3e; --pitch-b: #1c6339; --chalk: rgba(255,255,255,.75);
  --team: #3d7cf0; --opp: #e5483f; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: .95rem; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--you); outline-offset: 2px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .95rem;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--muted); padding: 7px 11px; font-weight: 700; font-family: var(--font-display); font-size: 1rem; letter-spacing: .06em; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.roles { display: flex; gap: 6px; flex-wrap: wrap; }
.roles .label { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; color: var(--muted); align-self: center; margin-right: 4px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: .92rem;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.board { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { padding: 8px 12px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .k { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lvlbar { height: 4px; background: var(--surface-2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.lvlbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }

.question { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.question h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1.15; margin: 0; text-wrap: balance; min-width: 0; flex: 1 1 320px; }
.meta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); margin-right: 6px; }

.pitch-wrap { background: var(--pitch-b); border-radius: var(--radius); padding: 6px; box-shadow: 0 1px 0 var(--line); }
svg.pitch { display: block; width: 100%; height: auto; max-width: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.pl text { font-family: var(--font-display); font-weight: 700; pointer-events: none; }
.opt { cursor: pointer; }
.opt .hit { fill: transparent; }
.opt:hover .body, .opt:focus-visible .body { stroke: var(--you); stroke-width: .5; }
.opt:focus { outline: none; }
.opt:focus-visible .hit { stroke: var(--you); stroke-width: .3; stroke-dasharray: .8 .6; }
.spot .ring { fill: rgba(255,255,255,.18); stroke: #fff; stroke-width: .3; stroke-dasharray: .9 .6; }
.spot:hover .ring { fill: rgba(255,255,255,.35); }
.goal-hit { fill: rgba(255,255,255,0); }
.opt.goal:hover .goal-hit { fill: rgba(242,183,5,.35); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px var(--line); }

.controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.controls .left, .controls .right { display: flex; gap: 8px; flex-wrap: wrap; }

.feedback { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.feedback .verdict { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.feedback .verdict.ok { color: var(--good); }
.feedback .verdict.no { color: var(--bad); }
.feedback .pts { font-size: 1rem; color: var(--muted); font-weight: 700; }
.feedback p { margin: 0; max-width: 70ch; }
.feedback .line b { font-weight: 600; }
.feedback .tip { border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); font-size: .95rem; }
.feedback .tip strong { color: var(--fg); font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .85rem; margin-right: 6px; }
.feedback.idle { color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--fg); padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(5,15,10,.55); }
.dlg { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.dlg h3 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; text-transform: uppercase; }
.dlg ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.dlg li b { font-weight: 600; }
.dlg table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.dlg th, .dlg td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.dlg th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .85rem; color: var(--muted); }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--bad); font-weight: 600; }

@media (max-width: 560px) {
  .brand h1 { font-size: 1.7rem; }
  .brand p { display: none; }
  .stat { padding: 6px 8px; }
  .stat .k { font-size: .66rem; letter-spacing: .04em; }
  .stat .v { font-size: 1.25rem; }
  .question h2 { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="appTitle">Fotball<span>-IQ</span></h1>
      <p id="appSub"></p>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnPrinciples" type="button"></button>
      <button class="btn" id="btnStats" type="button"></button>
      <div class="lang" role="group" aria-label="Language / Språk">
        <button type="button" id="langNo" aria-pressed="true">NO</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <nav class="roles" id="roles" aria-label="Role"></nav>

  <section class="board" aria-live="polite">
    <div class="stat"><div class="k" id="kScore"></div><div class="v" id="vScore">0</div></div>
    <div class="stat"><div class="k" id="kStreak"></div><div class="v" id="vStreak">0</div></div>
    <div class="stat"><div class="k" id="kBest"></div><div class="v" id="vBest">0</div></div>
    <div class="stat"><div class="k" id="kAcc"></div><div class="v" id="vAcc">–</div></div>
    <div class="stat"><div class="k" id="kLevel"></div><div class="v" id="vLevel">1</div><div class="lvlbar"><i id="lvlFill"></i></div></div>
  </section>

  <div class="question">
    <h2 id="qText"></h2>
    <div class="meta"><span class="tag" id="qTag"></span><span id="qNum"></span></div>
  </div>

  <div class="pitch-wrap">
    <svg class="pitch" id="pitch" viewBox="-4 -4 113 76" role="img" aria-label="Pitch"></svg>
  </div>

  <div class="legend" id="legend"></div>

  <div class="controls">
    <div class="left">
      <button class="btn" id="btnHint" type="button"></button>
      <button class="btn" id="btnSkip" type="button"></button>
    </div>
    <div class="right">
      <button class="btn primary" id="btnNext" type="button" disabled></button>
    </div>
  </div>

  <section class="feedback idle" id="feedback" aria-live="polite"></section>
</div>

<dialog id="dlgPrinciples"><div class="dlg">
  <h3 id="pTitle"></h3>
  <ol id="pList"></ol>
  <div class="row"><button class="btn primary" type="button" data-close></button></div>
</div></dialog>

<dialog id="dlgStats"><div class="dlg">
  <h3 id="sTitle"></h3>
  <div style="overflow-x:auto"><table id="sTable"></table></div>
  <div class="row" id="sRow">
    <button class="btn" type="button" id="btnReset"></button>
    <button class="btn primary" type="button" data-close></button>
  </div>
</div></dialog>

  },

    score: "Score", streak: "Streak", best: "Best", acc: "Accuracy", level: "Level",
    hint: "Show hint (−50%)", hintUsed: "Hint shown", skip: "Skip", next: "Next puzzle →",
    puzzle: "Puzzle", types: { pass: "Passing", shoot: "Pass / shoot", move: "Movement", mark: "Defending", gk: "Distribution" },

let lang = "no";
function tr(path, vars) {
  let v = path.split(".").reduce((o, k) => (o == null ? o : o[k]), I18N[lang]);
  if (typeof v !== "string") return v;
  if (vars) v = v.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : ""));
  return v;
}

/* ================= persistence ================= */
const SAVE_KEY = "fotball-iq.v1";
const ROLE_KEYS = ["mix", "gk", "def", "mid", "wing", "st"];
function freshStats() {
  const roleStats = {}; ROLE_KEYS.forEach(r => roleStats[r] = { played: 0, right: 0 });
  return { score: 0, streak: 0, bestStreak: 0, played: 0, right: 0, roleStats, role: "mix", lang: null };
}
let S = freshStats();
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const d = JSON.parse(raw); S = Object.assign(freshStats(), d); S.roleStats = Object.assign(freshStats().roleStats, d.roleStats || {}); } } catch (e) {}
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
const levelOf = () => Math.min(10, 1 + Math.floor(S.right / 6));

/* ================= geometry ================= */
const L = 105, W = 68, GY1 = 30.34, GY2 = 37.66;

/* ================= evaluation ================= */
function evalPass(from, to, opps) {
  const f = { kind: "pass" }; let s = 20;

/* ================= generation ================= */
function makeGen(seed) {
  const rng = mulberry32(seed);

      if (p.x < 1.5 || p.x > L - 1.5 || p.y < 1.5 || p.y > W - 1.5) continue;
      if (all.every(q => dist(p, q) >= minSep)) return p;

const ROLE_NUM = { gk: 1, def: 4, mid: 8, wing: 7, st: 9 };
function carrierBox(role, G) {
  if (role === "gk") return { x: G.R(4, 7), y: G.R(28, 40) };
  if (role === "def") return { x: G.R(14, 36), y: G.pick([G.R(6, 16), G.R(24, 44), G.R(52, 62)]) };
  if (role === "mid") return { x: G.R(36, 62), y: G.R(12, 56) };
  if (role === "wing") return { x: G.R(62, 88), y: G.rng() < .5 ? G.R(4, 14) : G.R(54, 64) };

function genPass(G, role, level) {
  const c = carrierBox(role, G); c.n = ROLE_NUM[role]; c.you = true;
  const all = [c];
  const nT = role === "gk" ? 4 + (level > 3 ? 1 : 0) : 4 + (level > 2 ? 1 : 0) + (level > 6 ? 1 : 0);
  const box = role === "gk" ? [3, 42, 4, 64] : [Math.max(3, c.x - 22), Math.min(101, c.x + 32), 3, 65];

  let oi = 0;
  const addOpp = p => { if (!p) return; p.n = on[oi++]; opps.push(p); all.push(p); };
  addOpp(G.near(all, c, 3.4, 5.5, 3.2, 0));
  const traps = 1 + (level > 3 ? 1 : 0) + (level > 7 ? 1 : 0);
  for (let i = 0; i < traps; i++) { const m = G.pick(mates); addOpp(G.onLane(all, c, m, 3.2)); }

  for (let i = 0; i < Math.max(1, extra); i++) addOpp(G.place(all, ahead, 3.5));
  if (c.x > 50 || mates.some(m => m.x > 55)) { const k = { x: G.R(101, 103.2), y: clamp(34 + (c.y - 34) * 0.15, 31, 37), gk: true, n: 1 }; opps.push(k); all.push(k); }
  const canShoot = c.x > 72;
  const options = mates.map(m => ({ id: "p" + m.n, target: m, label: tr("player", { n: m.n }), f: evalPass(c, m, opps) }));
  if (canShoot) options.push({ id: "shot", target: { x: L, y: 34 }, label: tr("shotLabel"), f: evalShot(c, opps), shot: true });
  if (canShoot) {
    const bestPass = Math.max(...options.filter(o => !o.shot).map(o => o.f.score));
    const sh = options.find(o => o.shot); if (bestPass > sh.f.score + 15) sh.f.better = true;

function genMove(G, role, level) {
  const box = { def: [24, 46, 5, 63], mid: [40, 66, 10, 58], wing: [64, 88, 4, 64], st: [70, 92, 16, 52] }[role];
  const you = { x: G.R(box[0], box[1]), y: role === "wing" ? (G.rng() < .5 ? G.R(4, 16) : G.R(52, 64)) : G.R(box[2], box[3]), n: ROLE_NUM[role], you: true };
  const all = [you];

  for (let i = 0; i < nT; i++) { const p = G.place(all, [Math.max(3, you.x - 25), Math.min(100, you.x + 22), 4, 64], 7); if (p) { p.n = ns[i + 1]; mates.push(p); all.push(p); } }

  const addOpp = p => { if (!p) return; p.n = on[oi++]; opps.push(p); allX.push(p); };

    const f = evalPass(c, sp, opps);

function genMark(G, role, level) {

  const on = G.nums([]); c.n = on[0];
  const ourGK = { x: 2.5, y: 34, gk: true, n: 1 };

  for (let i = 0; i < nA; i++) { const p = G.place(all, [8, Math.min(42, c.x - 2), 5, 63], 7); if (!p) return null; p.n = on[i + 1]; atts.push(p); all.push(p); }

function typesFor(role) {

function generatePuzzle(seed, roleSel, level) {

  const kind = G.pick(typesFor(role));
  const margin = clamp(16 - level, 6, 15);
  for (let attempt = 0; attempt < 400; attempt++) {
    const P = kind === "pass" ? genPass(G, role, level) : kind === "move" ? genMove(G, role, level) : genMark(G, role, level);

    const sorted = P.options.slice().sort((a, b) => b.f.score - a.f.score);
    const best = sorted[0], second = sorted[1];
    if (!second || best.f.invalid) continue;
    const m = attempt > 300 ? margin / 2 : margin;
    if (best.f.score - second.f.score < m) continue;
    if (P.type !== "mark" && best.f.score < 8) continue;
    if (best.f.covered || best.f.attOffside || best.f.marked) continue;
    if (!P.options.some(o => o.f.invalid || o.f.score < best.f.score - 25)) continue;
    P.best = best; P.seed = seed; P.level = level;

/* ================= explanations ================= */
function reasonsFor(o, P) {
  const f = o.f, r = [];
  const add = (k, v) => r.push(tr("r." + k, v));
  if (f.kind === "shot") {
    if (f.shotBlocked) add("shotBlocked", { k: f.blockN });
    if (f.shotPoor) add("shotPoor");
    if (f.shotGood) add("shotGood");
    if (f.better) add("better");
    return r;
  }
  if (f.kind === "mark") {
    ["far", "attOffside", "covered", "laneCov", "danger", "unmarked", "laneOpen", "lowThreat"].forEach(k => f[k] && add(k));
    return r.slice(0, 3);
  }
  const neg = [], pos = [];
  const N = (k, v) => neg.push(tr("r." + k, v)), Pz = (k, v) => pos.push(tr("r." + k, v));
  if (f.offside) N("offside");
  if (f.blocked) N("blocked", { n: f.blocked.n });
  if (f.crowd) N("crowd");
  if (f.marked) N("marked");
  if (f.dangerOwn) N("dangerOwn");
  if (f.long) N("long");
  if (f.tight && !f.blocked) N("tight");
  if (f.pressure) N("pressure");
  if (!f.invalid) {
    if (f.box) Pz("box"); else if (f.open) Pz("open");
    if (f.dx > 4) Pz("forward", { d: Math.round(f.dx) }); else if (f.dx < -3) Pz("backward"); else Pz("square");
  }
  r.push(...(f.invalid ? neg.concat(pos) : pos.concat(neg)));
  return r.slice(0, 3);
}
function joinList(arr) {
  if (arr.length <= 1) return arr.join("");
  return arr.slice(0, -1).join(", ") + " " + tr("and") + " " + arr[arr.length - 1];
}
function sentence(o, P) { const rs = reasonsFor(o, P); const s = joinList(rs); return s ? s.charAt(0).toUpperCase() + s.slice(1) + "." : ""; }
function tipFor(choice, P) {
  const f = choice.f;
  if (f.kind === "mark") return 7;
  if (f.kind === "shot") return 6;
  if (f.offside) return 4;
  if (f.blocked || f.tight) return 2;
  if (f.dangerOwn) return 8;
  if (f.crowd) return 5;
  if (f.marked || f.pressure) return 1;
  if (P.best.shot) return 6;
  if (P.type === "gk") return 9;
  if (f.long) return 3;
  return 3;
}

  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  g.setAttribute("aria-label", opt.label);
  el("circle", { class: "hit", r: hitR || 3.6 }, g).parentNode.insertBefore(g.lastChild, g.firstChild);
  g.addEventListener("click", () => answer(opt));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); answer(opt); } });
}
let ballEl = null, overlay = null;
function render(P) {
  const layer = drawPitch();
  overlay = el("g", {}, layer);
  const pl = el("g", {}, layer);
  // offside line on easy levels for attacking puzzles
  if (P.type !== "mark" && P.level <= 3) {
    const x = offsideLine(P.opps);
    if (x > L / 2 + 0.5) el("line", { x1: x, y1: 0, x2: x, y2: W, stroke: css("--you"), "stroke-width": 0.25, "stroke-dasharray": "1 1", opacity: 0.8 }, overlay);
  }
  if (P.type === "move") {
    P.spots.forEach(sp => {
      el("line", { x1: P.you.x, y1: P.you.y, x2: sp.x, y2: sp.y, stroke: "#fff", "stroke-width": 0.25, "stroke-dasharray": "0.8 0.8", opacity: 0.6 }, overlay);
      const g = el("g", { class: "spot", transform: `translate(${sp.x} ${sp.y})` }, pl);
      el("circle", { class: "ring", r: 1.9 }, g);
      const t = el("text", { "text-anchor": "middle", "dominant-baseline": "central", "font-size": 2, fill: "#fff", "font-family": "Barlow Condensed, sans-serif", "font-weight": 700 }, g);
      t.textContent = sp.l;
      sp._g = g;
      makeClickable(g, P.options.find(o => o.target === sp), 3.4);
    });
  }
  const teamPlayers = P.type === "mark" ? P.mates.concat([P.you]) : [P.you].concat(P.mates.filter(m => m !== P.you));
  if (P.type === "move" && !teamPlayers.includes(P.carrier)) teamPlayers.push(P.carrier);
  teamPlayers.forEach(p => drawPlayer(pl, p, "team"));
  P.opps.forEach(p => drawPlayer(pl, p, "opp"));
  P.options.forEach(o => {
    if (o.shot) {
      const g = el("g", { class: "goal" }, pl);
      el("rect", { class: "goal-hit", x: L - 1, y: GY1 - 2, width: 4.5, height: GY2 - GY1 + 4, rx: 0.6 }, g);
      el("rect", { x: L, y: GY1, width: 2, height: GY2 - GY1, fill: "none", stroke: css("--you"), "stroke-width": 0.35, "stroke-dasharray": "0.8 0.5" }, g);
      g.classList.add("opt"); g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", o.label);
      g.addEventListener("click", () => answer(o));
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); answer(o); } });
    } else if (P.type !== "move") {
      makeClickable(o.target._g, o);
    }
  });
  fitView(P);
  const c = P.carrier;
  ballEl = el("circle", { cx: c.x + 1.3, cy: c.y + 1.3, r: 0.75, fill: "#fff", stroke: "#111", "stroke-width": 0.18 }, pl);
}
function fitView(P) {
  const pts = [P.you, P.carrier].concat(P.mates, P.opps.filter(o => !o.gk), P.spots || []);
  if (P.options.some(o => o.shot)) pts.push({ x: L + 2, y: 34 });
  let x0 = Math.min(...pts.map(p => p.x)) - 7, x1 = Math.max(...pts.map(p => p.x)) + 7;
  let y0 = Math.min(...pts.map(p => p.y)) - 7, y1 = Math.max(...pts.map(p => p.y)) + 7;
  const cw = document.querySelector(".pitch-wrap").clientWidth, narrow = cw > 0 && cw < 600;
  const ratio = narrow ? 1.15 : 113 / 76, minW = narrow ? 40 : 62;
  let w = Math.max(x1 - x0, minW, (y1 - y0) * ratio), h = w / ratio;
  if (h > 76) { h = 76; w = Math.min(113, Math.max(w, h * ratio)); }
  if (w > 113) { w = 113; h = Math.min(76, w / ratio); }
  let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let vx = clamp(cx - w / 2, -4, 109 - w), vy = clamp(cy - h / 2, -4, 72 - h);
  svg.setAttribute("viewBox", `${vx.toFixed(2)} ${vy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
}
function arrow(a, b, kind, layer) {
  const len = dist(a, b) || 1, ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
  const sx = a.x + ux * 2, sy = a.y + uy * 2, ex = b.x - ux * 2.1, ey = b.y - uy * 2.1;
  const col = kind === "good" ? css("--good") : kind === "bad" ? css("--bad") : kind === "you" ? css("--you") : "#ffffff";
  return el("line", { x1: sx, y1: sy, x2: ex, y2: ey, stroke: col, "stroke-width": kind === "chalk" ? 0.3 : 0.6, "marker-end": `url(#ar-${kind})`, "stroke-dasharray": kind === "chalk" ? "1 0.8" : "none", "stroke-linecap": "round", opacity: kind === "chalk" ? 0.85 : 1 }, layer || overlay);
}
function ring(p, col) { el("circle", { cx: p.x, cy: p.y, r: 2.3, fill: "none", stroke: col, "stroke-width": 0.5 }, overlay); }
function animate(node, from, to, ms, attrX, attrY, off) {
  return new Promise(res => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { node.setAttribute(attrX, to.x + off); node.setAttribute(attrY, to.y + off); return res(); }
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      node.setAttribute(attrX, from.x + (to.x - from.x) * e + off); node.setAttribute(attrY, from.y + (to.y - from.y) * e + off);
      k < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}

/* ================= game flow ================= */
let P = null, answered = false, hintUsed = false, seedCounter = 0;
function newSeed() { return (Date.now() ^ Math.floor(Math.random() * 0x7fffffff) ^ (++seedCounter * 2654435761)) >>> 0; }
function nextPuzzle() {
  P = generatePuzzle(newSeed(), S.role, levelOf());
  answered = false; hintUsed = false;
  render(P);
  updateTexts();
  const fb = document.getElementById("feedback");
  fb.className = "feedback idle"; fb.textContent = tr("idle");
  document.getElementById("btnNext").disabled = true;
  document.getElementById("btnHint").disabled = false;
  document.getElementById("btnSkip").disabled = false;
}
function showHint() {
  if (!P || answered || hintUsed) return;
  hintUsed = true;
  const from = P.type === "mark" ? P.carrier : P.carrier;
  P.options.forEach(o => {
    if (o.shot) return;
    const ln = arrow(from, o.target, "chalk");
    const f = o.f;
    if (f.blocked) ring(f.blocked, css("--warn"));
    if (f.kind === "mark" && f.laneCov) ln.setAttribute("opacity", 0.3);
    if (f.blocked) ln.setAttribute("opacity", 0.35);
  });
  document.getElementById("btnHint").disabled = true;
  document.getElementById("btnHint").textContent = tr("hintUsed");
}
async function answer(opt) {
  if (!P || answered) return;
  answered = true;
  const best = P.best, ok = opt === best;
  overlay.innerHTML = "";
  if (P.type === "move") {
    const youG = P.you._g;
    await new Promise(res => {
      const from = { x: P.you.x, y: P.you.y }, to = opt.target, t0 = performance.now();
      const step = now => { const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3); youG.setAttribute("transform", `translate(${from.x + (to.x - from.x) * e} ${from.y + (to.y - from.y) * e})`); k < 1 ? requestAnimationFrame(step) : res(); };
      matchMedia("(prefers-reduced-motion: reduce)").matches ? (youG.setAttribute("transform", `translate(${to.x} ${to.y})`), res()) : requestAnimationFrame(step);
    });
  }
  if (P.type === "mark") {
    const a = opt.target, to = { x: a.x - 1.8, y: a.y + (34 - a.y) * 0.06 };
    arrow(P.you, a, ok ? "good" : "bad");
    if (!ok) arrow(P.you, best.target, "good");
    ring(best.target, css("--good"));
    if (!ok) ring(a, css("--bad"));
  } else {
    if (!ok) arrow(P.carrier, best.target, "good");
    arrow(P.carrier, opt.target, ok ? "good" : "bad");
    if (opt.f.blocked) ring(opt.f.blocked, css("--warn"));
    const end = opt.f.blocked ? opt.f.blocked : opt.target;
    await animate(ballEl, { x: P.carrier.x, y: P.carrier.y }, opt.shot ? { x: L + 0.6, y: 34 + (Math.random() - 0.5) * 5 } : end, Math.min(700, 250 + dist(P.carrier, end) * 14), "cx", "cy", opt.shot ? 0 : 1.1);
  }
  // scoring
  S.played++; const rs = S.roleStats[P.role]; rs.played++;
  const mixRs = S.role === "mix" ? S.roleStats.mix : null; if (mixRs) mixRs.played++;
  let pts = 0;
  if (ok) {
    S.right++; rs.right++; if (mixRs) mixRs.right++;
    S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    pts = Math.round((10 + 2 * P.level + Math.min(S.streak - 1, 10)) * (hintUsed ? 0.5 : 1));
    S.score += pts;
  } else S.streak = 0;
  save();
  showFeedback(opt, ok, pts);
  updateBoard();
  document.getElementById("btnNext").disabled = false;
  document.getElementById("btnHint").disabled = true;
  document.getElementById("btnSkip").disabled = true;
  document.getElementById("btnNext").focus({ preventScroll: true });
}
let lastFeedback = null;
function showFeedback(opt, ok, pts) {
  lastFeedback = { opt, ok, pts };
  const fb = document.getElementById("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  const v = document.createElement("div");
  v.className = "verdict " + (ok ? "ok" : "no");
  v.textContent = opt ? (ok ? tr("correct") : tr("wrong")) : tr("skipped");
  if (ok) { const s = document.createElement("span"); s.className = "pts"; s.textContent = tr("pts", { p: pts }); v.appendChild(s); }
  fb.appendChild(v);
  const line = (label, o) => { const p = document.createElement("p"); p.className = "line"; const b = document.createElement("b"); b.textContent = label + " – " + o.label + ": "; p.appendChild(b); p.appendChild(document.createTextNode(sentence(o, P))); fb.appendChild(p); };
  if (opt && !ok) line(tr("yourChoice"), opt);
  line(tr("bestChoice"), P.best);
  const tipIdx = opt && !ok ? tipFor(opt, P) : tipFor(P.best, P);
  const pr = tr("p")[tipIdx];
  const tp = document.createElement("p"); tp.className = "tip";
  const st = document.createElement("strong"); st.textContent = tr("tip"); tp.appendChild(st);
  tp.appendChild(document.createTextNode(pr[0] + ". " + pr[1])); fb.appendChild(tp);
}
function skip() {
  if (!P || answered) return;
  answered = true;
  overlay.innerHTML = "";
  if (P.type === "mark") { arrow(P.you, P.best.target, "good"); ring(P.best.target, css("--good")); }
  else arrow(P.carrier, P.best.target, "good");
  S.streak = 0; save(); updateBoard();
  showFeedback(null, false, 0);
  document.getElementById("btnNext").disabled = false;
  document.getElementById("btnHint").disabled = true;
  document.getElementById("btnSkip").disabled = true;
}

/* ================= UI text ================= */
function updateBoard() {
  document.getElementById("vScore").textContent = S.score;
  document.getElementById("vStreak").textContent = S.streak;
  document.getElementById("vBest").textContent = S.bestStreak;
  document.getElementById("vAcc").textContent = S.played ? Math.round(100 * S.right / S.played) + "%" : "–";
  const lv = levelOf();
  document.getElementById("vLevel").textContent = lv;
  document.getElementById("lvlFill").style.width = lv >= 10 ? "100%" : ((S.right % 6) / 6 * 100) + "%";
}
function renderRoles() {
  const nav = document.getElementById("roles"); nav.innerHTML = "";
  const lab = document.createElement("span"); lab.className = "label"; lab.textContent = tr("role"); nav.appendChild(lab);
  ROLE_KEYS.forEach(r => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.id = "role-" + r;
    b.textContent = tr("roles." + r); b.setAttribute("aria-pressed", S.role === r ? "true" : "false");
    b.addEventListener("click", () => { if (S.role === r) return; S.role = r; save(); renderRoles(); nextPuzzle(); });
    nav.appendChild(b);
  });
}
function updateTexts() {
  document.documentElement.lang = lang === "no" ? "no" : "en";
  document.title = lang === "no" ? "Fotball-IQ" : "Football IQ";
  document.getElementById("appTitle").innerHTML = lang === "no" ? "Fotball<span>-IQ</span>" : "Football <span>IQ</span>";
  document.getElementById("appSub").textContent = tr("sub");
  document.getElementById("btnPrinciples").textContent = tr("principles");
  document.getElementById("btnStats").textContent = tr("stats");
  document.getElementById("langNo").setAttribute("aria-pressed", lang === "no");
  document.getElementById("langEn").setAttribute("aria-pressed", lang === "en");
  [["kScore", "score"], ["kStreak", "streak"], ["kBest", "best"], ["kAcc", "acc"], ["kLevel", "level"]].forEach(([id, k]) => document.getElementById(id).textContent = tr(k));
  document.getElementById("btnHint").textContent = hintUsed ? tr("hintUsed") : tr("hint");
  document.getElementById("btnSkip").textContent = tr("skip");
  document.getElementById("btnNext").textContent = tr("next");
  if (P) {
    document.getElementById("qText").textContent = tr("q." + P.type);
    document.getElementById("qTag").textContent = tr("roles." + P.role) + " · " + tr("types." + P.type);
    document.getElementById("qNum").textContent = tr("puzzle") + " #" + (P.seed % 100000).toString().padStart(5, "0");
    P.options.forEach(o => { o.label = o.shot ? tr("shotLabel") : o.target.l ? tr("spot", { l: o.target.l }) : tr("player", { n: o.target.n }); });
    // re-label "YOU"
    svg.querySelectorAll(".pl").forEach(g => { const t = g.querySelector("text"); if (t && t.getAttribute("font-size") === "1.9") t.textContent = tr("you"); });
  }
  const lg = document.getElementById("legend"); lg.innerHTML = "";
  const item = (col, txt, ringc) => { const s = document.createElement("span"); const d = document.createElement("i"); d.className = "dot"; d.style.background = col; if (ringc) d.style.boxShadow = "0 0 0 2px " + ringc; s.appendChild(d); s.appendChild(document.createTextNode(txt)); lg.appendChild(s); };
  item("var(--team)", tr("legend.you"), "var(--you)");
  item("var(--team)", tr("legend.team"));
  item("var(--opp)", tr("legend.opp"));
  if (P && P.type === "move") item("rgba(255,255,255,.4)", tr("legend.spot"));
  if (P && P.type !== "mark" && P.level <= 3 && offsideLine(P.opps) > L / 2 + 0.5) item("var(--you)", tr("legend.off"));
  if (answered && lastFeedback) showFeedback(lastFeedback.opt, lastFeedback.ok, lastFeedback.pts);
  else if (!answered) { const fb = document.getElementById("feedback"); fb.className = "feedback idle"; fb.textContent = tr("idle"); }
  renderRoles();
}
function setLang(l) { lang = l; S.lang = l; save(); updateTexts(); }

function openPrinciples() {
  document.getElementById("pTitle").textContent = tr("principles");
  const ol = document.getElementById("pList"); ol.innerHTML = "";
  tr("p").forEach(([h, b]) => { const li = document.createElement("li"); const s = document.createElement("b"); s.textContent = h + ". "; li.appendChild(s); li.appendChild(document.createTextNode(b)); ol.appendChild(li); });
  document.querySelectorAll("#dlgPrinciples [data-close]").forEach(b => b.textContent = tr("close"));
  document.getElementById("dlgPrinciples").showModal();
}
function openStats() {
  document.getElementById("sTitle").textContent = tr("statsTitle");
  const tb = document.getElementById("sTable");
  tb.innerHTML = "";
  const hr = tb.insertRow(); [tr("colRole"), tr("colPlayed"), tr("colRight"), tr("colAcc")].forEach(h => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  ["gk", "def", "mid", "wing", "st"].forEach(r => {
    const s = S.roleStats[r], row = tb.insertRow();
    [tr("roles." + r), s.played, s.right, s.played ? Math.round(100 * s.right / s.played) + "%" : "–"].forEach(v => row.insertCell().textContent = v);
  });
  resetRow(false);
  document.getElementById("dlgStats").showModal();
}
function resetRow(asking) {
  const row = document.getElementById("sRow"); row.innerHTML = "";
  if (asking) {
    const d = document.createElement("div"); d.className = "confirm"; d.textContent = tr("resetAsk"); row.appendChild(d);
    const y = document.createElement("button"); y.className = "btn"; y.type = "button"; y.textContent = tr("yes");
    y.onclick = () => { const keepLang = lang, keepRole = S.role; S = freshStats(); S.lang = keepLang; S.role = keepRole; save(); updateBoard(); document.getElementById("dlgStats").close(); nextPuzzle(); };
    const n = document.createElement("button"); n.className = "btn primary"; n.type = "button"; n.textContent = tr("no"); n.onclick = () => resetRow(false);
    row.appendChild(y); row.appendChild(n);
  } else {
    const r = document.createElement("button"); r.className = "btn"; r.type = "button"; r.textContent = tr("reset"); r.onclick = () => resetRow(true);
    const c = document.createElement("button"); c.className = "btn primary"; c.type = "button"; c.textContent = tr("close"); c.onclick = () => document.getElementById("dlgStats").close();
    row.appendChild(r); row.appendChild(c);
  }
}

/* ================= boot ================= */
load();
lang = S.lang || ((navigator.language || "").toLowerCase().match(/^(nb|nn|no)/) ? "no" : (navigator.language ? "en" : "no"));
document.getElementById("langNo").onclick = () => setLang("no");
document.getElementById("langEn").onclick = () => setLang("en");
document.getElementById("btnNext").onclick = nextPuzzle;
document.getElementById("btnHint").onclick = showHint;
document.getElementById("btnSkip").onclick = skip;
document.getElementById("btnPrinciples").onclick = openPrinciples;
document.getElementById("btnStats").onclick = openStats;
document.querySelectorAll("dialog [data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => P && fitView(P), 150); });
document.addEventListener("keydown", e => { if (e.key === "n" && answered && !document.querySelector("dialog[open]")) nextPuzzle(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => P && !answered && render(P));
updateBoard();
nextPuzzle();
</script>
